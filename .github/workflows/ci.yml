name: ci

# Proves a from-zero install works on Linux + macOS, then asserts health with the
# doctor. Catches the class of bug that only shows on a cold machine (cold-start
# plugin requires, missing tools, shell-init hangs) before it reaches a real box.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          # For PRs, check out the source branch. Same-repo PRs (Renovate) can
          # then receive a formatter cleanup commit before linting fails.
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - uses: jdx/mise-action@v4.3.0
        with:
          install: false

      - name: install lint tools
        run: mise install -y shellcheck stylua

      - name: format lua
        run: stylua nvim/.config/nvim

      - name: commit lua formatting fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v6.0.1
        with:
          commit_message: "style: format lua with stylua"
          file_pattern: nvim/.config/nvim/**/*.lua

      - name: assert lua formatting
        run: git diff --exit-code -- nvim/.config/nvim

      - name: shellcheck
        run: shellcheck --severity=warning install.sh link.sh uninstall.sh themes/theme wsl/wsl-optimize.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0

      - name: cache mise tools
        uses: actions/cache@v5.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ matrix.os }}-${{ hashFiles('mise.toml') }}

      - name: cold install (skip heavy JVM / android tools)
        run: ./install.sh --skip gradle,java,android-sdk

      - name: doctor (asserts nvim loads, tmux parses, tools present, no shell hang)
        run: ./install.sh --check
