name: ci

# Proves a from-zero install works on Linux + macOS, then asserts health with the
# doctor. Catches the class of bug that only shows on a cold machine (cold-start
# plugin requires, missing tools, shell-init hangs) before it reaches a real box.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          sha256: 6fa596291e9758106f761fea4f8e7fac6c3e7ff4714d5c0b9a76e16068db14f6
          install: false

      - name: install lint tools
        run: mise install --locked -y shellcheck stylua neovim

      - name: assert lua formatting
        run: stylua --check nvim/.config/nvim

      - name: shellcheck
        run: shellcheck --severity=warning install.sh link.sh uninstall.sh themes/theme wsl/wsl-optimize.sh shell/.config/shell/ca-bundle.sh shell/.config/shell/ca-system-roots.sh tools/*.sh tests/ca-bundle.sh tests/bootstrap-env.sh tests/security-bootstrap.sh

      - name: offline CA bundle regression checks
        run: bash tests/ca-bundle.sh

      - name: bootstrap environment regression checks
        run: bash tests/bootstrap-env.sh

      - name: security bootstrap regression checks
        run: bash tests/security-bootstrap.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: cache mise tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise
          key: mise-${{ matrix.os }}-${{ hashFiles('mise.toml', 'mise.lock', '.mise/locks/**', 'install.sh', 'tools/**') }}

      - name: cold install (skip heavy JVM / android tools)
        run: ./install.sh --skip gradle,java,android-sdk

      - name: doctor (asserts nvim loads, tmux parses, tools present, no shell hang)
        run: ./install.sh --check --skip gradle,java,android-sdk
