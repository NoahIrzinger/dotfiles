set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins/'
set-option -sg escape-time 10

#key maps
unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key g run-shell '~/.local/share/tmux/plugins/tmux-grep/tmux_grep.sh'

unbind '-'
bind '-' split-window -v -c "#{pane_current_path}"
unbind '\'
bind '\' split-window -h -c "#{pane_current_path}"

# window navigation: prefix + b = previous, prefix + n = next
unbind b
bind b previous-window
bind n next-window

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix + space
set -g @plugin 'catppuccin/tmux#v2.1.0' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jonmosco/kube-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_prefix_mapping_clear_screen ""


# styling and config
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_text "#W [#{b:pane_current_path}]"
set -g @catppuccin_window_default_text "#W [#{b:pane_current_path}]"
set -g @catppuccin_window_current_text "#W [#{b:pane_current_path}]"
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
#set-option -g automatic-rename on
#set-option -g automatic-rename-format "#W #(~/.local/share/tmux/plugins/nvim-path/nvim_path.sh)"

# active theme palette (generated by the `theme` CLI). Must precede catppuccin
# so our @thm_* / @catppuccin_flavor overrides win its only-if-unset defaults.
source-file -q ~/.config/tmux/theme.conf

# source the plugin here
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# Custom module text foregrounds must be set before status_module.conf renders
# each module. The status_module helper only applies its defaults when these are
# unset, so setting them in module files after Catppuccin has run is too late.
set -gF @catppuccin_status_ctp_cpu_text_fg '#{E:@thm_subtext_1}'
set -gF @catppuccin_status_ctp_memory_text_fg '#{E:@thm_subtext_1}'
set -gF @catppuccin_status_primary_ip_text_fg '#{E:@thm_subtext_1}'
set -gF @catppuccin_status_custom_date_time_text_fg '#{E:@thm_subtext_1}'
set -gF @catppuccin_status_custom_kube_text_fg '#{E:@thm_subtext_1}'

# load custom modules
source -F '#{d:current_file}/custom_modules/ctp_cpu.conf'
source -F '#{d:current_file}/custom_modules/ctp_memory.conf'
source -F '#{d:current_file}/custom_modules/primary_ip.conf'
source -F '#{d:current_file}/custom_modules/custom_date_time.conf'
source -F '#{d:current_file}/custom_modules/custom_kube.conf'

set -g mouse on

set -g prefix C-s
set -g allow-rename off
# Let the theme CLI pass OSC color updates through tmux to the parent terminal
# emulator (iTerm2, Windows Terminal, kitty, WezTerm, etc.).
set -g allow-passthrough on
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right-length 100
set -g status-right '#{E:@catppuccin_status_custom_kube}'
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
set -agF status-right '#{E:@catppuccin_status_primary_ip}'
set -agF status-right '#{E:@catppuccin_status_custom_date_time}'
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color*:RGB'
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'

# Per-theme status styling (custom headers), generated by the `theme` CLI. Deferred
# via run-shell and placed AFTER tpm: catppuccin sets window-status-format from its
# own async job (and tpm re-sources catppuccin), so a synchronous source here loses
# the race. Queuing last makes a custom header the final word. Empty for plain themes
# (-> no-op, catppuccin's default bar stays). Switching themes clears any prior
# header's multi-row state via `theme`'s reset_status; see themes/README.md.
run-shell 'tmux source-file -q ~/.config/tmux/theme-style.conf'
