# vim:set ft=tmux:
%hidden MODULE_NAME="custom_kube"

# Requires https://github.com/jonmosco/kube-tmux

set-environment -g KUBE_TMUX_SYMBOL_ENABLE false
set-environment -g KUBE_TMUX_NS_ENABLE false

set -ogq "@catppuccin_${MODULE_NAME}_icon" "󱃾 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_blue}"
set -ogqF "@catppuccin_kube_context_color" "#{E:@thm_red}"
set -ogqF "@catppuccin_kube_namespace_color" "#{E:@thm_sky}"
# tmux runs #() with a bare PATH (no mise shims), so kubectl is invisible and
# kube-tmux prints BINARY-N/A. prepend the mise shim + bin dirs for this call.
set -ogq "@catppuccin_${MODULE_NAME}_text" \
   " #(PATH=#{HOME}/.local/share/mise/shims:#{HOME}/.local/bin:/usr/local/bin:/usr/bin:/bin ${TMUX_PLUGIN_MANAGER_PATH}kube-tmux/kube.tmux 250 #{@catppuccin_kube_context_color} #{@catppuccin_kube_namespace_color})"

source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'
