%hidden MODULE_NAME="ctp_cpu"

set -ogq "@catppuccin_${MODULE_NAME}_icon" ' '
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_surface_2}"
set -gqF "@catppuccin_status_${MODULE_NAME}_icon_fg" "#{?#{==:#{@catppuccin_flavor},latte},#{E:@thm_fg},#{E:@thm_crust}}"
set -gqF "@catppuccin_status_${MODULE_NAME}_text_bg" "#{E:@thm_surface_2}"
set -ogq "@catppuccin_${MODULE_NAME}_text" ' #{l:#{cpu_percentage}}'

source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'

