# vim:set ft=tmux:
%hidden MODULE_NAME="custom_date_time"

set-environment -g TZ UTC
set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰃰 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_sapphire}"
set -ogq "@catppuccin_${MODULE_NAME}_text" ' %Y-%m-%d %H:%M UTC'


source -F '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/utils/status_module.conf'
