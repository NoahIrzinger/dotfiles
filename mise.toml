# Single canonical toolset. Versions are PINNED (to a major/minor line) rather than
# "latest" for reproducibility and supply-chain review: a fresh install gets the same
# tools across machines, and a surprise upstream major can't land without a reviewed
# commit here. mise verifies download checksums for these registry tools. Bump a line
# intentionally (e.g. `mise use ripgrep@16`) and commit it.
# Opt out per machine:  ./install.sh --skip gradle,java
#   or persist:         export MISE_DISABLE_TOOLS="gradle,java"
[tools]
# editor / terminal / cli
neovim    = "0.12"
tmux      = "3.6b"
zoxide    = "0.10.0"
fzf       = "0.74.1"
ripgrep   = "15"
fd        = "10"
jq        = "1.8"
lazygit   = "0.63.1"
shellcheck = "0.11"
stylua     = "2.5"
# kulala.nvim builds its own http parser at setup via the `tree-sitter` CLI
# (tree-sitter build -o ...); without it nvim throws ENOENT 'tree-sitter'.
tree-sitter = "0.26.11"

# languages
go        = "1.26.5"
# Delve must track the Go toolchain closely. Mason's delve can lag and Go will
# reject old debuggers at launch ("version of Delve is too old"). Keep dlv in
# mise so it wins PATH before Mason's bin.
# held at 1.26.3: the v1.27.0 GitHub release ships zero binary assets, so the aqua
# backend has nothing to download ("no asset found"). bump once upstream attaches
# darwin/linux binaries again (Renovate will re-propose it).
"aqua:go-delve/delve" = "1.26.3"
python    = "3.14.6"
node      = "24.18.0"
"go:github.com/air-verse/air" = "1.67.1"

# kubernetes
kubectl   = "1.36"
k9s       = "0.51.0"
kubecolor = "0.6"
helm      = "4"

# codex via the npm backend (independent of the node tool, so it survives node
# upgrades, unlike a plain `npm i -g`). EXACT version on purpose: a partial pin
# (0.137) makes mise query the npm registry to resolve the patch on every shell
# activation, which hangs behind a proxy. an exact version is a filesystem check.
"npm:@openai/codex" = "0.144.6"

# pi (earendil) is a pure-JS coding agent: bin is dist/cli.js, os=any, no
# postinstall. so the npm backend works cleanly here, unlike claude/opencode
# below (whose npm wrappers need a postinstall mise skips). same exact-pin rule
# as codex: an exact version is a filesystem check, not a proxy-hanging registry
# query. bump with `mise use npm:@earendil-works/pi-coding-agent@<ver>`.
"npm:@earendil-works/pi-coding-agent" = "0.81.1"

# gemini (google) is pure-JS too: bin is bundle/gemini.js, no os/cpu pin, no
# postinstall. npm backend works cleanly like codex/pi above. same exact-pin
# rule: an exact version is a filesystem check, not a proxy-hanging registry
# query. bump with `mise use npm:@google/gemini-cli@<ver>`.
"npm:@google/gemini-cli" = "0.51.0"

# claude + opencode ship native binaries; their npm packages are thin downloaders
# whose postinstall mise's npm backend skips (the wrapper then errors "native binary
# not installed"). use the aqua backend, which fetches the real release binary.
# claude self-update is off (DISABLE_AUTOUPDATER in common.sh) so mise owns the version.
claude   = "2.1.216"
opencode = "1.18.4"

# heavier toolchains (android builds etc.). skip on lean boxes / CI:
#   ./install.sh --skip gradle,java,android-sdk
java          = "temurin-21"   # LTS, AGP-compatible; don't bump past what Android supports
gradle        = "9"
"android-sdk" = "11.0"          # cmdline-tools (sdkmanager); install platforms/build-tools per project

[settings]
# fail fast instead of bricking shell startup: fewer retries on a stalled network.
http_retries = 1
fetch_remote_versions_timeout = "8s"
